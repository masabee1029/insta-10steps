<figure class="zk" aria-label="図解：月1回の振り返り">
<figcaption class="zk-h"><b>図解：月1回の振り返り（6つの手順）</b><small>6まで行ったら、次の月にまた1から</small></figcaption>
<ol class="zk-cycle"><li><span class="zk-n">1</span>期間を<b>「30日」</b>にする</li><li><span class="zk-n">2</span><b>「閲覧者」</b>と<b>「新規フォロワー」</b>を見る</li><li><span class="zk-n">3</span>閲覧者がいちばん多かった投稿を1つ選ぶ</li><li><span class="zk-n">4</span>その投稿の<b>「フォロワー以外」</b>の割合を見る</li><li><span class="zk-n">5</span>良かった理由を、1つだけ考える</li><li><span class="zk-n">6</span>次の月は、その理由を取り入れて投稿</li></ol>
<p class="zk-note">大切なのは、良かった理由を1つにしぼることです。いくつも一度に変えると、何が効いたのか分からなくなります。</p>
</figure>
